{% extends "base.html" %}
{% block title %}Notifications{% endblock %}

{% block content %}

<div class="flex items-start justify-between mb-2 flex-wrap gap-3">
  <div>
    <h1 class="text-2xl font-bold">Notifications</h1>
    <p class="text-gray-400 text-sm mt-1">Assignment and alert-resolution history. New notifications arrive live — no need to refresh.</p>
  </div>
  <button id="markAllBtn"
    class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 text-sm px-4 py-2 rounded-lg transition-colors">
    Mark all as read
  </button>
</div>

<div class="flex gap-2 mb-6 mt-4 flex-wrap">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="unread">Unread</button>
  <button class="filter-btn" data-filter="assignment">Assignments</button>
  <button class="filter-btn" data-filter="resolved">Resolved</button>
  <button class="filter-btn" data-filter="verification">Work Orders</button>
  <button class="filter-btn" data-filter="critical">Critical</button>
</div>

<div id="loadingState" class="bg-gray-800 rounded-xl text-center text-gray-500 py-12">Loading notifications&hellip;</div>
<div id="emptyState" class="bg-gray-800 rounded-xl text-center text-gray-500 py-12" style="display:none;"></div>

<div id="notifList" class="flex flex-col gap-2"></div>

<style>
  .filter-btn {
    padding: 4px 14px;
    border-radius: 9999px;
    font-size: 0.75rem;
    background: #374151;
    color: #d1d5db;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: #4b5563; }
  .filter-btn.active { background: #2563eb; color: white; border-color: #3b82f6; }

  .notif-item { transition: background 0.15s; }
  .notif-item:hover { background: #2d3748; }
  .notif-item.unread { background: rgba(37, 99, 235, 0.1); border-color: #2563eb; }
</style>

<script>
(function () {
  let allNotifs = [];
  let filter = 'all';

  const TYPE_META = {
    assignment:           { icon: '👤', bg: '#1e3a5f', text: '#60a5fa' },
    resolved:             { icon: '✅', bg: '#14532d', text: '#4ade80' },
    false_positive:       { icon: '❌', bg: '#78350f', text: '#fbbf24' },
    critical_alert:       { icon: '🔴', bg: '#7f1d1d', text: '#f87171' },
    risk_escalated:       { icon: '⚠️', bg: '#78350f', text: '#fbbf24' },
    verification_pending: { icon: '🕵️', bg: '#4c1d95', text: '#c4b5fd' },
    wo_closed:            { icon: '🏁', bg: '#14532d', text: '#4ade80' },
    wo_rejected:          { icon: '↩️', bg: '#7f1d1d', text: '#f87171' },
    system:               { icon: '⚙️', bg: '#374151', text: '#9ca3af' },
  };

  function typeMeta(n) {
    return TYPE_META[n.type] || (
      n.level === 'critical' ? TYPE_META.critical_alert :
      n.level === 'warning'  ? TYPE_META.risk_escalated :
      TYPE_META.system
    );
  }

  function matchesFilter(n) {
    if (filter === 'unread') return !n.read_at;
    if (filter === 'assignment') return n.type === 'assignment';
    if (filter === 'resolved') return n.type === 'resolved' || n.type === 'false_positive';
    if (filter === 'critical') return n.type === 'critical_alert' || n.type === 'risk_escalated' || n.level === 'critical';
    if (filter === 'verification') return ['verification_pending', 'wo_closed', 'wo_rejected'].includes(n.type);
    return true;
  }

  function timeAgo(iso) {
    const then = new Date(iso + 'Z').getTime();
    const diffSec = Math.floor((Date.now() - then) / 1000);
    if (diffSec < 60) return 'just now';
    if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm ago';
    if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h ago';
    return Math.floor(diffSec / 86400) + 'd ago';
  }

  function render() {
    const list = document.getElementById('notifList');
    const items = allNotifs.filter(matchesFilter);

    document.getElementById('emptyState').style.display = items.length ? 'none' : 'block';
    document.getElementById('emptyState').innerHTML = filter === 'all'
      ? '🎉<br>You\'re all caught up. No new notifications.'
      : 'Nothing here for this filter.';

    list.innerHTML = items.map((n) => {
      const meta = typeMeta(n);
      return `
      <div class="notif-item ${n.read_at ? 'bg-gray-800 border border-gray-700' : 'unread border'} rounded-xl px-4 py-3.5 flex gap-3 items-start cursor-pointer" data-id="${n.id}">
        <span class="w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0 mt-0.5" style="background:${meta.bg};color:${meta.text};">${meta.icon}</span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-100">${n.title}</div>
          <div class="text-sm text-gray-400 mt-0.5">${n.message}</div>
          <div class="text-xs text-gray-500 mt-1">${timeAgo(n.created_at)}</div>
        </div>
        ${n.record_id ? `<a class="text-xs text-blue-400 hover:text-blue-300 hover:underline whitespace-nowrap" href="/record/${n.record_id}">View record &rarr;</a>` : ''}
      </div>`;
    }).join('');

    list.querySelectorAll('.notif-item').forEach((el) => {
      el.addEventListener('click', () => markRead(parseInt(el.dataset.id, 10)));
    });
  }

  function markRead(id) {
    const n = allNotifs.find((x) => x.id === id);
    if (!n || n.read_at) return;
    n.read_at = new Date().toISOString();
    render();
    fetch(`/api/notifications/${id}/read`, { method: 'POST', keepalive: true }).catch(() => {});
    window.dispatchEvent(new Event('notif:sync'));
  }

  function load() {
    fetch('/api/notifications')
      .then((r) => r.json())
      .then((json) => {
        if (json.error) throw new Error(json.error);
        allNotifs = json.notifications;
        document.getElementById('loadingState').style.display = 'none';
        render();
      })
      .catch((err) => {
        document.getElementById('loadingState').textContent = 'Could not load notifications: ' + err.message;
      });
  }

  document.getElementById('markAllBtn').addEventListener('click', () => {
    allNotifs.forEach((n) => { n.read_at = n.read_at || new Date().toISOString(); });
    render();
    fetch('/api/notifications/read-all', { method: 'POST', keepalive: true }).catch(() => {});
    window.dispatchEvent(new Event('notif:sync'));
  });

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  const es = new EventSource('/api/notifications/stream');
  es.onmessage = (e) => {
    try {
      const payload = JSON.parse(e.data);
      allNotifs.unshift(payload);
      render();
    } catch (err) { /* ping frames aren't JSON, ignore */ }
  };

  window.addEventListener('notif:sync', load);
  load();
})();
</script>
{% endblock %}
