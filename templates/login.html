{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-blue-400 mb-1">⚙ PredictiveMaint</h1>
    <p class="text-gray-400 text-sm mb-6">Sign in to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="mb-4 rounded-lg px-3 py-2 text-sm
            {{ 'bg-red-900 border border-red-700 text-red-200' if category == 'error'
               else 'bg-green-900 border border-green-700 text-green-200' if category == 'success'
               else 'bg-gray-800 border border-gray-700 text-gray-200' }}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="text-xs text-gray-400">Username</label>
        <input type="text" name="username" required autofocus
          class="mt-1 w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm
                 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="text-xs text-gray-400">Password</label>
        <input type="password" name="password" required
          class="mt-1 w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm
                 text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 transition-colors rounded-lg py-2 text-sm font-medium">
        Log in
      </button>
    </form>
  </div>
</div>
{% endblock %}
